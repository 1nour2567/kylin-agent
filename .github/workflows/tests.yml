name: tests

on:
  push:
  pull_request:

jobs:
  structural:
    name: structural tests (no LLM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Backend tests (83)
        working-directory: backend
        run: pytest tests/ -q

      - name: Security hardening tests (6)
        run: pytest tests/ -q
